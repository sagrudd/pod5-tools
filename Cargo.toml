[package]
name = "pod5-tools"
version = "0.1.0"
edition = "2024"
description = "Operational tooling for Oxford Nanopore POD5 datasets"
license = "MIT"
repository = "https://github.com/sagrudd/pod5-tools"

[dependencies]
chrono = { version = "0.4.38", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5.40", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[dev-dependencies]
tempfile = "3.20.0"
